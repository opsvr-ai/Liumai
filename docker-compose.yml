# ============================================================
# 六脉 (Liumai) — RCA Dashboard platform
# ============================================================
# Start everything:
#   docker compose up -d
#
# Build + start (after code changes):
#   docker compose up -d --build
#
# Start only specific services:
#   docker compose up -d postgres redis
# ============================================================

services:
  # ===========================================================
  # PostgreSQL 16 — primary data store
  # ===========================================================
  postgres:
    image: postgres:16-alpine
    container_name: liumai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liumai
      POSTGRES_USER: liumai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-liumai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # DB port is NOT exposed to host by default — access via internal Docker network only.
    # To expose for debugging, set DB_PORT=5432 in .env and uncomment the line below:
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    networks:
      - liumai-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liumai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # Redis 7 — caching & session store
  # ===========================================================
  redis:
    image: redis:7-alpine
    container_name: liumai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-liumai_redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - liumai-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-liumai_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================
  # FastAPI backend — RCA analysis engine
  # ===========================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: liumai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://liumai:${DB_PASSWORD:-liumai_dev}@postgres:5432/liumai
      JWT_SECRET: ${JWT_SECRET:-liumai-dev-jwt-secret-change-in-production}
      # Hermes URL / API Key are configured via admin UI → 系统设置
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-liumai_redis_secret}@redis:6379/0
      RCA_MAX_CONCURRENCY: ${RCA_MAX_CONCURRENCY:-5}
      # Agent artifacts: Hermes writes here on the host, the backend serves them.
      HERMES_FILES_DIR: /data/hermes-files
      HERMES_FILES_HOST_PATH: ${HERMES_FILES_HOST_PATH:-E:\dev\Liumai\hermes-files}
    volumes:
      - ./hermes-skills:/opt/hermes-skills:ro
      - ./hermes-files:/data/hermes-files
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - liumai-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    extra_hosts:
      # host.docker.internal → host gateway (Linux Docker 20.10+)
      # Allows the backend to reach Hermes Gateway running on the host
      - "host.docker.internal:host-gateway"

  # ===========================================================
  # nginx + React frontend — dashboard UI
  # ===========================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: liumai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - liumai-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  # Hermes Gateway — install on host:
  #   curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
  # Set HERMES_GATEWAY_URL=http://host.docker.internal:8080 in .env

# ══════════════════════════════════════════════════════════════════
# WARNING: Do NOT run `docker compose down -v` — this permanently
# deletes all database data (volumes postgres_data / redis_data).
# Use `docker compose down` (without -v) instead.
# ══════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:

networks:
  liumai-net:
    driver: bridge
