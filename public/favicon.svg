<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="六脉 Liumai">
  <title>六脉 Liumai</title>
  <style>
    .favicon-bg { fill: #ffffff; }
    .favicon-ink { fill: #4f6bf7; }
    @media (prefers-color-scheme: dark) {
      .favicon-bg { fill: #101016; }
      .favicon-ink { fill: #e6ebff; }
    }
  </style>

  <!-- 22.7% rounded container keeps the 16px tab icon clean -->
  <rect class="favicon-bg" width="512" height="512" rx="116" />

  <!-- Simplified mark for 16px: one core dot + six radiating nodes -->
  <g class="favicon-ink">
    <circle cx="256" cy="256" r="54" />
    <circle cx="256" cy="110" r="38" />
    <circle cx="382.44" cy="183" r="38" />
    <circle cx="382.44" cy="329" r="38" />
    <circle cx="256" cy="402" r="38" />
    <circle cx="129.56" cy="329" r="38" />
    <circle cx="129.56" cy="183" r="38" />
  </g>
</svg>
