<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>

    <!-- 核心能量渐变 -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 连接路径渐变 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- 外部节点渐变 -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 弱发光滤镜 -->
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景底板（可移除背景以保持透明，但深色底可更好衬托科技感） -->
  <rect width="512" height="512" rx="40" fill="url(#bgGrad)" />

  <!-- 运维轨道（象征数据监控与流转） -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.3" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 16" opacity="0.2" />

  <!-- 六脉连接路径（能量/数据流） -->
  <g id="meridians" fill="none">
    <!-- 实体能量流 -->
    <path d="M 256 256 Q 320 300, 377.2 326" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />
    <path d="M 256 256 Q 256 330, 256 396" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />
    <path d="M 256 256 Q 192 300, 134.8 326" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />
    <path d="M 256 256 Q 192 212, 134.8 186" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />
    <path d="M 256 256 Q 256 182, 256 116" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />
    <path d="M 256 256 Q 320 212, 377.2 186" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowSoft)" />

    <!-- 数据脉冲点（智能运维的数字感） -->
    <g stroke="#06B6D4" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round">
      <path d="M 256 256 Q 320 300, 377.2 326" />
      <path d="M 256 256 Q 256 330, 256 396" />
      <path d="M 256 256 Q 192 300, 134.8 326" />
      <path d="M 256 256 Q 192 212, 134.8 186" />
      <path d="M 256 256 Q 256 182, 256 116" />
      <path d="M 256 256 Q 320 212, 377.2 186" />
    </g>
  </g>

  <!-- 外部节点（六脉终端） -->
  <g id="nodes" transform="translate(256, 256)">
    <!-- 节点1 -->
    <g transform="translate(121.2, 70) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- 节点2 -->
    <g transform="translate(0, 140) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- 节点3 -->
    <g transform="translate(-121.2, 70) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- 节点4 -->
    <g transform="translate(-121.2, -70) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- 节点5 -->
    <g transform="translate(0, -140) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- 节点6 -->
    <g transform="translate(121.2, -70) rotate(15)">
      <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- 数智平台核心（智能大脑/AI处理中心） -->
  <g id="core">
    <!-- 外层光晕 -->
    <circle cx="256" cy="256" r="60" fill="#06B6D4" opacity="0.1" filter="url(#glowSoft)" />
    <!-- 旋转数据环 -->
    <circle cx="256" cy="256" r="50" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="15 20" opacity="0.8" />
    <!-- 核心六边形架构 -->
    <polygon points="45,0 22.5,38.97 -22.5,38.97 -45,0 -22.5,-38.97 22.5,-38.97" fill="none" stroke="url(#coreGrad)" stroke-width="3" transform="translate(256, 256) rotate(15)" filter="url(#glow)" />
    <polygon points="25,0 12.5,21.65 -12.5,21.65 -25,0 -12.5,-21.65 12.5,-21.65" fill="#3B82F6" opacity="0.6" transform="translate(256, 256) rotate(45)" />
    <!-- 精准目标点（数智决策） -->
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" filter="url(#glow)" />
    <path d="M 246 256 L 266 256 M 256 246 L 256 266" stroke="#0B0F19" stroke-width="2" />
  </g>

  <!-- 平台名称 -->
  <text x="256" y="460" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" filter="url(#glowSoft)">六脉智能运维数智平台</text>
  
  <!-- 英文副标题（增强国际化与数智感） -->
  <text x="256" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="4">INTELLIGENT OPS &amp; DIGITAL PLATFORM</text>
</svg>